[package]
name = "screenshot-organizer"
version = "0.1.0"
edition = "2021"
description = "macOSのスクリーンショットをApple Vision OCR + Ollaya判断モデルで自動分類するCLI"

[dependencies]
apple-vision = { version = "0.16", features = ["recognize_text"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
anyhow = "1"

[profile.release]
lto = true
